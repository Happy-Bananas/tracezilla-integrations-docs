services:
  docs:
    build: .
    working_dir: /site
    command: /site/docker/start-docs
    init: true
    volumes:
      - .:/site
      - bundle:/usr/local/bundle
    ports:
      - "4000:4000"
      - "35729:35729"
    healthcheck:
      test: ["CMD", "ruby", "-rsocket", "-e", "socket = TCPSocket.new('127.0.0.1', 4000); socket.close"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 10s

volumes:
  bundle:
