services:
  docs:
    build: .
    working_dir: /site
    command: bundle exec jekyll serve --config _config.yml,_config.local.yml --host 0.0.0.0 --port 4000 --livereload --force_polling
    volumes:
      - .:/site
      - bundle:/usr/local/bundle
    ports:
      - "4000:4000"
      - "35729:35729"

volumes:
  bundle:
